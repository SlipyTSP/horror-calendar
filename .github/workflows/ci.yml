# CI: unit tests plus a real dry run against TMDB on every PR and push to main.
# The dry run publishes the release table in the job summary and uploads output/
# as an artifact. It never deploys (deploying is update-calendar.yml's job).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  dry-run:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate calendar (real TMDB request)
        run: npm start
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_LANGUAGE: es-ES
          TMDB_REGION: ES
          # Read-only use of the published providers snapshot (arrivals, docs/data-model.md §11)
          SNAPSHOT_URL: https://slipytsp.github.io/horror-calendar/providers-snapshot.json

      - name: Write release table to the job summary
        run: node scripts/summary.js >> "$GITHUB_STEP_SUMMARY"

      - name: Upload output/ artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: output
          path: output/
          if-no-files-found: warn
          retention-days: 14
