# Workflow de GitHub Actions para Horror Calendar
# Genera el archivo .ics con estrenos de terror y lo publica en GitHub Pages

name: Actualizar Calendario de Terror

on:
  # Ejecución automática cada lunes a las 6:00 AM UTC
  schedule:
    - cron: '0 6 * * 1'

  # Permite ejecutar el workflow manualmente desde la pestaña Actions
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita ejecuciones simultáneas — si ya hay una corriendo, la nueva espera
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    # Configuramos el entorno de GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Paso 1: Clonar el repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Paso 2: Configurar Node.js 24
      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Paso 3: Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # Paso 4: Ejecutar el script para generar el .ics
      # La API key se lee desde los secretos del repositorio (Settings > Secrets)
      - name: Generar calendario .ics
        run: npm start
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_LANGUAGE: es-ES
          TMDB_REGION: ES

      # Paso 5: Preparar los archivos para GitHub Pages
      # Copiamos el .ics, releases.json y el index.html al directorio de deploy
      - name: Preparar directorio para Pages
        run: |
          mkdir -p _site
          cp output/horror.ics _site/horror.ics
          cp output/releases.json _site/releases.json
          cp output/index.html _site/index.html

      # Paso 6: Subir los archivos como artefacto de Pages
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Paso 7: Desplegar en GitHub Pages
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
