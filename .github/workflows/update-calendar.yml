# Workflow de GitHub Actions para Horror Calendar
# Genera los .ics con estrenos de terror y los publica en GitHub Pages junto a la web

name: Actualizar Calendario de Terror

on:
  # Ejecución automática cada lunes a las 6:00 AM UTC
  schedule:
    - cron: '0 6 * * 1'

  # Permite ejecutar el workflow manualmente desde la pestaña Actions
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita ejecuciones simultáneas — si ya hay una corriendo, la nueva espera
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    # Configuramos el entorno de GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Paso 1: Clonar el repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      # Paso 2: Configurar Node.js 24
      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Paso 3: Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # Paso 4: Ejecutar los tests antes de generar nada
      - name: Ejecutar tests
        run: npm test

      # Paso 5: Ejecutar el script para generar los .ics
      # La API key se lee desde los secretos del repositorio (Settings > Secrets)
      - name: Generar calendario .ics
        run: npm start
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_LANGUAGE: es-ES
          TMDB_REGION: ES
          # Foto anterior del catálogo de plataformas (llegadas, docs/data-model.md §11)
          SNAPSHOT_URL: https://slipytsp.github.io/horror-calendar/providers-snapshot.json

      # Paso 6: Preparar los archivos para GitHub Pages
      # Copiamos la web (site/), todos los .ics generados (glob), los mixes de output/mix/
      # (el glob no copia subcarpetas), releases.json y la foto del catálogo de
      # plataformas que leerá el próximo build
      - name: Preparar directorio para Pages
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp output/*.ics _site/
          mkdir -p _site/mix && cp -r output/mix/. _site/mix/
          cp output/releases.json _site/releases.json
          cp output/providers-snapshot.json _site/providers-snapshot.json

      # Paso 7: Subir los archivos como artefacto de Pages
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Paso 8: Desplegar en GitHub Pages
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Evita que GitHub desactive el cron tras 60 días sin commits en el repositorio.
  # Equivale al modo API de gautamkrishnar/keepalive-workflow (sin commits): vuelve a
  # habilitar este workflow con la API REST de Actions. Va en un job aparte para que
  # funcione aunque falle la generación, y con el permiso mínimo que necesita.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Mantener activo el cron
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update-calendar.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
